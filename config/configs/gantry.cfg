#####################################################################
#   Homing, Gantry Adjustment Routines, BedMesh
#####################################################################

[safe_z_home]
home_xy_position:175,175
speed:100
z_hop:10


##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
#  Probe points
points:
  25,25
  25,325
  325,325
  325,25
# points:
#       50,40
#       50,310
#       300,310
#       300,40
speed: 300
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.015 #0.0028
max_adjust: 10

[bed_mesh]
# FOLLOW THE FORUMULA FOR relative_reference_index to be centered, 
# This is only for manual call of BED_MESH_CABLIBRATE all those parameters are overridden on the fly if using the adaptive bed mesh macro
# for example:
# [(9x9)-1] / 2 = 40
# [(7x7)-1] / 2 = 24
# [(5x5)-1] / 2 = 12
speed: 350
horizontal_move_z: 12
mesh_min: 42, 42
mesh_max: 308, 308
#probe_count: 20, 20
#fade_start: 0.6
#fade_end: 10.0
algorithm: bicubic
# relative_reference_index: 12