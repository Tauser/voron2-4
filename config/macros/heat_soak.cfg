[gcode_macro HEAT_SOAK]
description: Estabiliza a câmara usando a mesa e a ventoinha de peça
gcode:
    {% set chamber = params.CHAMBER|default(65)|float %}
    {% set bed = params.BED|default(110)|float %}
    SAVE_GCODE_STATE NAME=heat_soak_state
    CG28
    G90
    G1 X150 Y128 F5000
    M190 S{bed}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    SET_LED LED=caselight RED=1 GREEN=0 BLUE=0
    M106 S255
    _WAIT_CHAMBER CHAMBER={chamber} TIMEOUT={params.TIMEOUT|default(1800)}
    M107
    SET_LED LED=caselight RED=0 GREEN=1 BLUE=0
    RESTORE_GCODE_STATE NAME=heat_soak_state

[gcode_macro _WAIT_CHAMBER]
description: Aguarda a câmara por até TIMEOUT segundos
gcode:
    {% set timeout = params.TIMEOUT|int %}
    {% if timeout < 0 %}
        {action_raise_error("TIMEOUT deve ser zero ou positivo")}
    {% endif %}
    {% for elapsed in range(0, timeout, 5) %}
        _CHAMBER_POLL TARGET={params.CHAMBER|float} SECONDS={[5, timeout - elapsed]|min}
    {% endfor %}
    _CHAMBER_CHECK TARGET={params.CHAMBER|float}

[gcode_macro _CHAMBER_POLL]
gcode:
    {% if printer["temperature_sensor CHAMBER"].temperature < params.TARGET|float %}
        G4 P{params.SECONDS|int * 1000}
        M400
    {% endif %}

[gcode_macro _CHAMBER_CHECK]
gcode:
    {% if printer["temperature_sensor CHAMBER"].temperature < params.TARGET|float %}
        TURN_OFF_HEATERS
        M107
        _CHAMBER_TIMEOUT TARGET={params.TARGET|float}
    {% endif %}

[gcode_macro _CHAMBER_TIMEOUT]
gcode:
    {action_raise_error("Câmara não atingiu %.1f °C no prazo. Aquecedores desligados." % (params.TARGET|float))}
