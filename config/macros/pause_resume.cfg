[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set head = printer.toolhead %}
        {% set lift = [0, [params.Z|default(10)|float, head.axis_maximum.z - head.position.z]|min]|max %}
        {% set x = params.X|default(head.axis_maximum.x / 2)|float %}
        {% set y = params.Y|default(head.axis_minimum.y + 5)|float %}
        {% if x < head.axis_minimum.x or x > head.axis_maximum.x or y < head.axis_minimum.y or y > head.axis_maximum.y %}
            {action_raise_error("Estacionamento fora do curso XY")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SAVE_GCODE_STATE NAME=print_pause
        BASE_PAUSE
        G91
        G1 Z{lift} F900
        SAVE_GCODE_STATE NAME=pause_lifted
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=lifted_z VALUE={head.position.z + lift}
        G90
        G1 X{x} Y{y} F6000
        SET_IDLE_TIMEOUT TIMEOUT=43200
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_lifted_z: 0
variable_etemp: 0
gcode:
    {% if printer.pause_resume.is_paused %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp}
        {% endif %}
        G91
        {% if printer.toolhead.position.z < lifted_z %}
            G1 Z{lifted_z - printer.toolhead.position.z} F900
        {% endif %}
        M83
        {% if etemp >= printer.configfile.settings.extruder.min_extrude_temp or (etemp == 0 and printer.extruder.can_extrude) %}
            G1 E{params.E|default(2.5)|float} F900
        {% endif %}
        RESTORE_GCODE_STATE NAME=pause_lifted MOVE=1 MOVE_SPEED=60
        RESTORE_GCODE_STATE NAME=print_pause MOVE=1 MOVE_SPEED=15
        BASE_RESUME {rawparams}
    {% endif %}
