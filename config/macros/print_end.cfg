[gcode_macro PRINT_END]
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    SAVE_GCODE_STATE NAME=print_end_state
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-8 F3600            # Mantém a retração líquida sem depositar material na peça
    {% endif %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set lift = [20, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        G91
        {% if lift > 0 %}
            G1 Z{lift} F900
        {% endif %}
        G90
        G1 X175 Y350 F3600
    {% endif %}
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=print_end_state
    RESPOND MSG="Impressão concluída."
