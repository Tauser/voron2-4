[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    # Modelagem de ponta rápida para não prender no resfriamento
    G1 E2.0 F3600            # Limpa pressão
    G1 E-10.0 F3600          # Retração de segurança
    
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 20.0) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91
    G0 Z{z_safe} X20.0 Y20.0 F20000
    TURN_OFF_HEATERS
    M107
    G90
    G0 X175 Y350 F3600       # Estaciona no fundo da mesa de 350mm
    
    BED_MESH_CLEAR
    RESPOND MSG="All done, GG."