[gcode_macro PRINT_START]
gcode:
  # Parâmetros enviados pelo Slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.HOTEND|default(params.EXTRUDER)|int %}
  {% set target_chamber = params.CHAMBER|default(40)|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  STATUS_HOMING         
  G28                   # Home total
  G90                   # Posicionamento absoluto
  BED_MESH_CLEAR        

  # --- AQUECIMENTO DA MESA E CÂMARA ---
  SET_DISPLAY_TEXT MSG="Aquecendo Mesa: {target_bed}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000       # Vai para o centro
  M190 S{target_bed}                    # Espera a mesa atingir temp alvo

  # Espera a câmara estabilizar (apenas se for ABS/Acima de 90c na mesa)
  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Estabilizando Câmara: {target_chamber}c"
    M106 S255                           # Liga ventoinha de peça para circular ar
    # Espera até a câmara atingir a temp ou até o tempo limite (evita travar)
    TEMPERATURE_WAIT SENSOR="temperature_sensor CHAMBER" MINIMUM={target_chamber}
  {% endif %}

  # --- PREPARAÇÃO PARA O TAP ---
  SET_DISPLAY_TEXT MSG="Hotend: 150c para Nivelamento"
  M109 S150                             # Temp segura para o Voron Tap

  SET_DISPLAY_TEXT MSG="Limpando Bico"
  CLEAN_NOZZLE

  SET_DISPLAY_TEXT MSG="QGL"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL

  SET_DISPLAY_TEXT MSG="Homing Z Final"
  G28 Z                                 # Home Z com Tap agora que o Gantry está reto

  SET_DISPLAY_TEXT MSG="Bed Mesh Adaptativo"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  # --- AQUECIMENTO FINAL ---
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107                                  # Desliga ventoinha
  M109 S{target_extruder}               # Aquece para temperatura de impressão
  
  SET_DISPLAY_TEXT MSG="Limpeza Final"
  CLEAN_NOZZLE                          # Limpa qualquer vazamento do aquecimento final

  SET_DISPLAY_TEXT MSG="Imprimindo..."
  STATUS_PRINTING
  SQUIGGLY_PURGE