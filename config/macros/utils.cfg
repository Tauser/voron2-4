# utils.cfg - macros atualizadas para StealthBurner + Galileo 2 + Rapido HF V1
# Base: Tauser/voron2-4 main, revisao 2026-11-11.
# Somente LOAD_FILAMENT e UNLOAD_FILAMENT foram alteradas.

[delayed_gcode DELAYED_OFF]
gcode:
    OFF

[gcode_macro RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    # SET_VELOCITY_LIMIT minimum_cruise_ratio={printer.configfile.settings.printer.max_accel_to_decel}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

[gcode_macro PARKCENTER]
gcode:
    ; home if not already homed
    CG28
    SAVE_GCODE_STATE NAME=PARKCENTER
    ; absolute positioning
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z20 F19500
    RESTORE_GCODE_STATE NAME=PARKCENTER

[gcode_macro OFF]
gcode:
    M84
    TURN_OFF_HEATERS
    M107

[gcode_macro MATERIAL_PA]
variable_applied_z: 0.0
gcode:
    {% set MATERIAL = params.MATERIAL|default("ABS")|upper %}

    {% if MATERIAL == "PLA" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.0525
        #SET_RETRACTION RETRACT_LENGTH=0.75 RETRACT_SPEED=40 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=30
        #SET_GCODE_OFFSET Z_ADJUST=0 MOVE=1
    {% elif MATERIAL == "ABS" %}
        #SET_PRESSURE_ADVANCE ADVANCE=0.0412
        SET_PRESSURE_ADVANCE ADVANCE=0.024
        #SET_RETRACTION UNRETRACT_SPEED=30 RETRACT_SPEED=35 RETRACT_LENGTH=0.5
        #SET_GCODE_OFFSET Z_ADJUST=0 MOVE=1
    {% elif MATERIAL == "PETG" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.0650
        # SET_RETRACTION RETRACT_LENGTH=1.4 RETRACT_SPEED=30 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=20
    {% endif %}
    {% if MATERIAL in ["PLA", "ABS", "PETG"] %}
        {% set offset = 0.020 if MATERIAL == "PETG" else 0.0 %}
        {% if offset != applied_z %}
            SET_GCODE_OFFSET Z_ADJUST={offset - applied_z}
            SET_GCODE_VARIABLE MACRO=MATERIAL_PA VARIABLE=applied_z VALUE={offset}
        {% endif %}
    {% endif %}

[gcode_macro PURGE]
gcode:
    #CLEAN_NOZZLE
    G1 X10 Y20 Z0.3 F19500.0
    G1 X10 Y200.0 Z0.3 F1500.0 E20
    RESET_EXTRUDER
    G1 Z2.0 F3000

[gcode_macro M600]
gcode:
    {% set X = params.X|default(60)|float %}
    {% set Y = params.Y|default(5)|float %}
    {% set Z = params.Z|default(15)|float %}
    {% if not printer.pause_resume.is_paused %}
        PAUSE X={X} Y={Y} Z={Z}
        {% if printer.extruder.can_extrude %}
            SAVE_GCODE_STATE NAME=M600_state
            M83
            G1 E-0.8 F2700
            G1 E-100 F1000
            RESTORE_GCODE_STATE NAME=M600_state
        {% endif %}
    {% endif %}

# LOAD_FILAMENT:
# - LOAD_DISTANCE: alimentacao ate proximo ao bico, a partir das engrenagens.
# - PURGE_DISTANCE: avanco adicional lento para purgar o material antigo.
# - Os 90+15 mm sao valores iniciais; confirmar percurso fisico antes de confiar.
# - CLEAN=0 por padrao para nao movimentar a ferramenta inesperadamente.
[gcode_macro LOAD_FILAMENT]
description: Galileo 2 - carrega e purga por material (MATERIAL e TEMP)
variable_load_distance: 90
variable_purge_distance: 15
gcode:
    {% set material = params.MATERIAL|default("ABS")|upper %}
    {% set temp_map = {"PLA":210, "PETG":235, "ABS":230, "ASA":245, "TPU":220} %}
    {% set target_temp = params.TEMP|default(params.TARGET_TEMP|default(temp_map.get(material, 0)))|float %}
    {% set load_len = params.LOAD_DISTANCE|default(load_distance)|float %}
    {% set purge_len = params.PURGE_DISTANCE|default(purge_distance)|float %}
    {% set fast_len = [load_len, 50.0]|min %}
    {% set slow_len = load_len - fast_len %}
    {% set fast_speed = params.LOAD_SPEED|default(180 if material == "TPU" else 300)|float %}
    {% set slow_speed = params.SLOW_SPEED|default(100 if material == "TPU" else 150)|float %}
    {% set purge_speed = params.PURGE_SPEED|default(params.SPEED|default(120))|float %}
    {% set clean = params.CLEAN|default(0)|int %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set max_temp = printer.configfile.settings.extruder.max_temp|float %}

    {% if material not in temp_map %}
        {action_raise_error("LOAD_FILAMENT: material invalido. Use PLA, PETG, ABS, ASA ou TPU.")}
    {% elif target_temp < min_temp or target_temp > max_temp - 15 %}
        {action_raise_error("LOAD_FILAMENT: TEMP fora da faixa segura configurada.")}
    {% elif load_len <= 0 or purge_len < 0 or fast_speed <= 0 or slow_speed <= 0 or purge_speed <= 0 or clean not in [0, 1] %}
        {action_raise_error("LOAD_FILAMENT: distancia, velocidade ou CLEAN invalido.")}
    {% elif clean == 1 and "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("LOAD_FILAMENT: CLEAN=1 requer G28 antes da carga.")}
    {% else %}
        RESPOND MSG="LOAD: {material} a {target_temp}C; carga {load_len}mm + purga {purge_len}mm"
        M109 S{target_temp}
        SAVE_GCODE_STATE NAME=galileo_load_state
        M83
        {% if fast_len > 0 %}
            G1 E{fast_len} F{fast_speed}
        {% endif %}
        {% if slow_len > 0 %}
            G1 E{slow_len} F{slow_speed}
        {% endif %}
        {% if purge_len > 0 %}
            G1 E{purge_len} F{purge_speed}
        {% endif %}
        {% if clean == 1 %}
            CLEAN_NOZZLE
        {% endif %}
        RESTORE_GCODE_STATE NAME=galileo_load_state
        RESPOND MSG="Carga concluida. Confirme fluxo continuo pelo bico."
    {% endif %}

# UNLOAD_FILAMENT:
# - UNLOAD_DISTANCE e a retracao TOTAL, incluindo TIP_DISTANCE.
# - 120 mm sao valor inicial, nao medida confirmada do seu caminho.
[gcode_macro UNLOAD_FILAMENT]
description: Galileo 2 - descarrega por material (MATERIAL e TEMP)
variable_unload_distance: 120
variable_purge_distance: 10
gcode:
    {% set material = params.MATERIAL|default("ABS")|upper %}
    {% set temp_map = {"PLA":210, "PETG":235, "ABS":230, "ASA":245, "TPU":220} %}
    {% set target_temp = params.TEMP|default(params.TARGET_TEMP|default(temp_map.get(material, 0)))|float %}
    {% set unload_len = params.UNLOAD_DISTANCE|default(unload_distance)|float %}
    {% set purge_len = params.PURGE_DISTANCE|default(purge_distance)|float %}
    {% set tip_len = params.TIP_DISTANCE|default(15)|float %}
    {% set purge_speed = params.PURGE_SPEED|default(params.SPEED|default(150))|float %}
    {% set tip_speed = params.TIP_SPEED|default(600 if material == "TPU" else 1200)|float %}
    {% set unload_speed = params.UNLOAD_SPEED|default(900 if material == "TPU" else 1800)|float %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set max_temp = printer.configfile.settings.extruder.max_temp|float %}

    {% if material not in temp_map %}
        {action_raise_error("UNLOAD_FILAMENT: material invalido. Use PLA, PETG, ABS, ASA ou TPU.")}
    {% elif target_temp < min_temp or target_temp > max_temp - 15 %}
        {action_raise_error("UNLOAD_FILAMENT: TEMP fora da faixa segura configurada.")}
    {% elif unload_len <= tip_len or tip_len <= 0 or purge_len < 0 or purge_speed <= 0 or tip_speed <= 0 or unload_speed <= 0 %}
        {action_raise_error("UNLOAD_FILAMENT: distancia ou velocidade invalida.")}
    {% else %}
        RESPOND MSG="UNLOAD: {material} a {target_temp}C; retracao total {unload_len}mm"
        M109 S{target_temp}
        SAVE_GCODE_STATE NAME=galileo_unload_state
        M83
        {% if purge_len > 0 %}
            G1 E{purge_len} F{purge_speed}
        {% endif %}
        G1 E-{tip_len} F{tip_speed}
        G4 P300
        G1 E-{unload_len - tip_len} F{unload_speed}
        RESTORE_GCODE_STATE NAME=galileo_unload_state
        RESPOND MSG="Descarga concluida. Confira se o filamento saiu das engrenagens."
    {% endif %}
